services:
  backend:
    build: ./backend
    container_name: codeatlas-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://codeatlas:codeatlas-dev-password@postgres:5432/codeatlas
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: codeatlas-documents
      AVATAR_BUCKET: codeatlas-avatars
      BROWSER_S3_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: codeatlas
      MINIO_ROOT_PASSWORD: codeatlas-dev-password
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      FRONTEND_URL: http://localhost:3000
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    profiles: ["test"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://codeatlas:codeatlas-dev-password@postgres:5432/codeatlas
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: codeatlas-documents
      AVATAR_BUCKET: codeatlas-avatars
      BROWSER_S3_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: codeatlas
      MINIO_ROOT_PASSWORD: codeatlas-dev-password
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      FRONTEND_URL: http://localhost:3000
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
  frontend:
    build: ./frontend
    container_name: codeatlas-frontend
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: {condition: service_healthy}
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: codeatlas-postgres
    environment: {POSTGRES_DB: codeatlas, POSTGRES_USER: codeatlas, POSTGRES_PASSWORD: codeatlas-dev-password}
    expose: ["5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U codeatlas -d codeatlas"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: codeatlas-redis
    expose: ["6379"]
    volumes: [redis_data:/data]
    command: redis-server --appendonly yes
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: docker.m.daocloud.io/minio/minio:latest
    container_name: codeatlas-minio
    environment: {MINIO_ROOT_USER: codeatlas, MINIO_ROOT_PASSWORD: codeatlas-dev-password}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"
    healthcheck: {test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"], interval: 10s, timeout: 5s, retries: 10}
volumes:
  postgres_data:
  redis_data:
  minio_data:
