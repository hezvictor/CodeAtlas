<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algora / ACM AI 助教原型</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root{--ink:#17201f;--muted:#78817d;--line:#dce2dc;--paper:#f7f8f4;--panel:#fff;--mint:#cfeee1;--green:#176b56;--coral:#f06d4f;--yellow:#f4d98e;--blue:#dceaf8;--mono:'DM Mono',monospace;--body:'Manrope',system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px}button,input,textarea{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}.app{min-height:100vh}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 34px;gap:38px;background:rgba(255,255,255,.86);position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px;letter-spacing:-1px}.brand i{display:inline-block;width:10px;height:10px;background:var(--coral);margin:0 7px 2px 0;border-radius:50%}.nav{display:flex;gap:26px;color:var(--muted)}.nav button.active,.nav button:hover{color:var(--ink)}.top-actions{margin-left:auto;display:flex;gap:12px;align-items:center}.pill{padding:9px 16px;border-radius:20px;border:1px solid var(--line)}.pill.fill{background:var(--ink);color:white;border-color:var(--ink)}.profile{width:32px;height:32px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:700}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{border-right:1px solid var(--line);padding:24px 16px;background:#f1f4ef}.side-title{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;margin:12px 10px}.side-item{width:100%;text-align:left;padding:11px 12px;border-radius:7px;margin:2px 0}.side-item.active{background:var(--mint);color:var(--green);font-weight:700}.side-item span{float:right;color:var(--muted);font-family:var(--mono);font-size:11px}.main{max-width:1200px;width:100%;margin:auto;padding:48px 56px}.eyebrow{font-family:var(--mono);font-size:11px;color:var(--green);letter-spacing:.5px}.display{font-size:clamp(34px,5vw,66px);line-height:1.02;letter-spacing:-3px;max-width:720px;margin:17px 0}.sub{color:var(--muted);max-width:560px;line-height:1.7}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:42px}.panel{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:10px}.panel h3{margin:0 0 20px;font-size:15px}.stat{font-family:var(--mono);font-size:34px}.muted{color:var(--muted)}.mini-list{display:grid;gap:13px}.mini-list div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}.chat-layout{height:calc(100vh - 68px);display:grid;grid-template-columns:250px minmax(0,1fr) 280px}.chat-side{border-right:1px solid var(--line);padding:20px;background:#f1f4ef}.chat-side .pill{width:100%;margin-bottom:24px}.chat-main{display:flex;flex-direction:column;min-width:0}.chat-head{height:70px;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;justify-content:space-between;align-items:center}.mode{font-family:var(--mono);font-size:11px;color:var(--green);background:var(--mint);padding:7px 10px;border-radius:5px}.messages{padding:44px clamp(24px,7vw,100px);overflow:auto;flex:1}.msg{max-width:720px;margin:0 auto 31px}.msg.user{margin-left:auto;background:var(--blue);padding:14px 17px;border-radius:9px;max-width:470px}.msg .label{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:9px}.msg p{line-height:1.75;margin:0}.think{border-left:2px solid var(--coral);padding:10px 15px;background:#fff9f0;line-height:1.7;color:#5d625d}.code{background:#1d2927;color:#d4e9df;border-radius:7px;padding:16px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow:auto}.composer{margin:0 auto 24px;width:min(720px,calc(100% - 48px));border:1px solid #cbd5ce;background:white;border-radius:10px;padding:14px;box-shadow:0 8px 24px #26382b10}.composer textarea{border:0;outline:0;resize:none;width:100%;height:42px}.composer-foot{display:flex;align-items:center;gap:8px}.composer-foot button{padding:7px 10px;border:1px solid var(--line);border-radius:5px;font-size:12px}.composer-foot .send{margin-left:auto;background:var(--coral);color:white;border-color:var(--coral)}.context{border-left:1px solid var(--line);padding:22px;background:#fbfcf9}.context h3{font-size:13px;margin:0 0 18px}.source{border-top:1px solid var(--line);padding:15px 0}.source b{display:block;margin-bottom:6px}.source small{color:var(--muted);line-height:1.5}.library-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px}.library-item{min-height:150px}.tag{font-family:var(--mono);font-size:10px;color:var(--green);display:inline-block;margin-bottom:24px}.table{margin-top:32px;border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:2fr 1fr 1fr 80px;padding:16px 4px;border-bottom:1px solid var(--line);align-items:center}.row.head{font-family:var(--mono);font-size:11px;color:var(--muted)}.bar{height:5px;background:var(--line);border-radius:5px}.bar i{display:block;height:100%;background:var(--green);border-radius:5px}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:8px 10px;border-radius:30px;display:flex;align-items:center;gap:13px;box-shadow:0 10px 30px #0003;z-index:9;font-family:var(--mono);font-size:11px}.switcher button{color:white;width:26px;height:26px;border:1px solid #ffffff44;border-radius:50%}.switcher strong{font-weight:500;min-width:170px;text-align:center}.toast{position:fixed;right:24px;bottom:24px;background:var(--green);color:white;padding:12px 16px;border-radius:6px;display:none}.auth{min-height:calc(100vh - 68px);display:grid;place-items:center}.auth-box{width:min(410px,calc(100% - 40px));background:#fff;border:1px solid var(--line);padding:34px;border-radius:10px}.auth-box h1{font-size:27px;margin:6px 0 28px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;color:var(--muted)}.field input{border:1px solid var(--line);padding:12px;border-radius:5px;outline-color:var(--green)}.auth-box .fill{width:100%;margin-top:10px}.link{color:var(--green);font-size:12px;text-align:center;margin-top:18px}
    .no-chat .shell{grid-template-columns:1fr}.no-chat .shell>.sidebar{display:none}.topbar{flex-wrap:nowrap;white-space:nowrap}.top-actions{flex-shrink:0}.signed-out .profile-wrap{display:none}.signed-out .top-actions .pill{display:inline-block}.signed-in .top-actions .pill{display:none}.signed-in .profile-wrap{display:block}.chat-side .side-item{display:block}.chat-side .side-item:hover{background:var(--mint)}
    @media(max-width:900px){.main{padding:34px 22px}.library-grid{grid-template-columns:1fr 1fr}.topbar{padding:0 18px;gap:15px}.nav{gap:12px;font-size:12px}.row{grid-template-columns:1.6fr 1fr 65px}.row>*:nth-child(3){display:none}}
    @media(max-width:560px){.nav button:nth-child(n+3){display:none}.display{letter-spacing:-2px}.split{grid-template-columns:1fr}.library-grid{grid-template-columns:1fr}.main{padding:28px 16px}.messages{padding:28px 16px}.chat-head{padding:16px}.switcher strong{min-width:130px}}
    .variant-B{--paper:#eef4f2;--mint:#d7e7f5;--green:#245c72}.variant-B .topbar{background:#172b32;color:#eef4f2;border-color:#30454b}.variant-B .shell{grid-template-columns:280px minmax(0,1fr)}.variant-B .sidebar{background:#e4eeeb}.variant-B .display{font-size:48px}.variant-B .panel{border-radius:2px;box-shadow:4px 4px 0 #c1d4ce}.variant-B .main:before{content:'LEARNING LOG  /  WEEK 03';display:block;font:11px var(--mono);color:var(--coral);margin-bottom:18px}.variant-C{--paper:#fbf8f1;--line:#d8d0c1;--green:#8a4d2c;--mint:#f2ddbd}.variant-C .topbar{border-bottom:3px solid var(--ink)}.variant-C .shell{grid-template-columns:1fr}.variant-C .sidebar{display:none}.variant-C .main{max-width:1320px;padding:42px 72px}.variant-C .display{font-family:Georgia,serif;font-size:60px;letter-spacing:-2px}.variant-C .split{grid-template-columns:1.4fr .6fr}.variant-C .panel{border-radius:0;background:transparent}.variant-C .library-grid{grid-template-columns:repeat(4,1fr)}
    .profile-wrap{position:relative}.profile-menu{display:none;position:absolute;right:0;top:42px;background:#fff;border:1px solid var(--line);padding:7px;width:130px;box-shadow:0 8px 20px #0002;z-index:8}.profile-menu button{width:100%;padding:9px;text-align:left}.profile-wrap.open .profile-menu{display:block}.mode-picker{position:relative}.mode-menu{display:none;position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--line);padding:7px;width:205px;box-shadow:0 8px 20px #0002;z-index:8}.mode-picker.open .mode-menu{display:block}.mode-menu button{width:100%;padding:10px;text-align:left;border-radius:4px}.mode-menu button:hover{background:var(--mint)}.mode-menu small{display:block;color:var(--muted);margin-top:3px}.attach input{display:none}
    @media(max-width:900px) and (min-width:701px){.chat-layout{grid-template-columns:250px minmax(0,1fr) 280px}.chat-side,.context{display:block}.shell{grid-template-columns:220px minmax(0,1fr)}.sidebar{display:block}}
    @media(max-width:700px){.chat-layout{grid-template-columns:1fr}.chat-side,.context{display:none}}
    .library-tools{display:flex;gap:10px;margin-top:28px;align-items:center}.library-tools input{flex:1;border:1px solid var(--line);background:white;padding:11px 13px;border-radius:5px;outline-color:var(--green)}.library-tools select{border:1px solid var(--line);background:white;padding:11px 13px;border-radius:5px;color:var(--muted)}
  </style>
</head>
<body>
  <div id="app"></div><div class="toast" id="toast">已切换到 ACM 分析模式</div>
  <script>
    const variants={A:'A / 对话优先',B:'B / 学习工作台',C:'C / 知识库优先'};
    const query=new URLSearchParams(location.search); let variant=(query.get('variant')||'A').toUpperCase(); if(!variants[variant])variant='A';
    const nav=(active)=>`<header class="topbar"><div class="brand"><i></i>algora</div><nav class="nav"><button class="active">首页</button><button>聊天</button><button>题库</button><button>知识库</button><button>学习记录</button></nav><div class="top-actions"><button class="pill">登录</button><button class="pill fill">注册</button><div class="profile">林</div></div></header>`;
    const side=`<aside class="sidebar"><button class="pill fill">＋ 新建会话</button><div class="side-title">最近会话</div><button class="side-item active">最短路怎么优化？<span>今天</span></button><button class="side-item">线段树模板复盘<span>昨天</span></button><button class="side-item">Codeforces 题解<span>3d</span></button><div class="side-title">我的知识库</div><button class="side-item">算法模板<span>24</span></button><button class="side-item">错题本<span>18</span></button><button class="side-item">比赛总结<span>06</span></button></aside>`;
    const chat=(mode='ACM 分析模式')=>`<div class="chat-layout"><aside class="chat-side"><button class="pill fill">＋ 新建会话</button><div class="side-title">今天</div><button class="side-item active">最短路怎么优化？</button><button class="side-item">树上差分的直觉</button><div class="side-title">30 天内</div><button class="side-item">线段树模板复盘</button><button class="side-item">错题：背包问题</button></aside><section class="chat-main"><div class="chat-head"><div><b>最短路怎么优化？</b><div class="muted" style="font-size:11px;margin-top:4px">私人知识库 · 8 条消息</div></div><button class="mode" onclick="toast()">⌘ ${mode}</button></div><div class="messages"><div class="msg user"><div class="label">你 · 09:42</div><p>有负权边但没有负环，Dijkstra 还能用吗？</p></div><div class="msg"><div class="label">ALGORA · 正在分析</div><div class="think"><b>分析路径</b><br>先确认边权性质，再区分“单源最短路”和“多源最短路”。这里的关键不是有没有负权，而是 Dijkstra 的贪心前提是否成立。</div><p style="margin-top:14px">不能直接使用。Dijkstra 依赖“已经确定的最小距离不会再被更新”，负权边会破坏这个前提。可以从 Bellman-Ford、SPFA（需注意最坏情况）或势能函数重标记的 Johnson 算法中选择。</p><div style="margin-top:14px" class="code">复杂度对比<br>Bellman-Ford  O(VE)<br>Johnson         O(VE + V E log V)</div></div></div><div class="composer"><textarea placeholder="向 Algora 提问，输入 @ 召回题库内容"></textarea><div class="composer-foot"><button>＋ 附件</button><button onclick="toast()">⌘ ACM 分析</button><button>引用：当前会话</button><button class="send" onclick="toast()">发送 ↑</button></div></div></section><aside class="context"><h3>回答依据</h3><div class="source"><b>算法模板 / 最短路.md</b><small>第 3 节 · Bellman-Ford<br>相关度 96%</small></div><div class="source"><b>错题本 / 图论复盘.pdf</b><small>第 12 页 · 负权边<br>相关度 88%</small></div><div class="source"><b>题库 / Johnson 算法</b><small>题目标签：最短路、势能<br>相关度 72%</small></div></aside></div>`;
    function home(){return nav()+`<div class="shell">${side}<main class="main"><div class="eyebrow">PERSONAL ALGORITHM COACH / 01</div><h1 class="display">把每一道题，<br><em style="color:var(--green);font-style:normal">变成自己的方法。</em></h1><p class="sub">从读题、推导到复盘，Algora 连接你的题解、模板和错题记录，陪你把“会做”变成可迁移的竞赛能力。</p><div class="split"><div class="panel"><h3>今日学习轨迹</h3><div class="stat">42<span style="font-size:14px;color:var(--muted)"> min</span></div><p class="muted">连续学习 7 天 · 比昨天多 12 min</p><div class="bar"><i style="width:68%"></i></div></div><div class="panel"><h3>继续上次的思考</h3><b>最短路怎么优化？</b><p class="muted">已完成：题意提取 · 算法候选</p><button class="pill fill" onclick="location.href='?variant=${variant}&page=chat'">继续对话 →</button></div></div></main></div>`}
    function library(){return nav()+`<div class="shell">${side}<main class="main"><div class="eyebrow">PRIVATE KNOWLEDGE / 02</div><h1 style="font-size:38px;letter-spacing:-1px;margin:15px 0 8px">你的知识库</h1><p class="sub">资料会被整理成可引用的上下文，回答有出处，复盘有痕迹。</p><div class="library-grid"><div class="panel library-item"><span class="tag">01 / TEMPLATE</span><h3>算法模板</h3><p class="muted">24 个文档 · 最近更新 2h 前</p></div><div class="panel library-item"><span class="tag">02 / NOTES</span><h3>个人笔记</h3><p class="muted">37 个文档 · 最近更新昨天</p></div><div class="panel library-item"><span class="tag">03 / WRONG</span><h3>错题本</h3><p class="muted">18 个文档 · 最近更新 3d 前</p></div></div><div class="table"><div class="row head"><span>文档</span><span>分组</span><span>状态</span><span>操作</span></div><div class="row"><b>最短路算法复盘.md</b><span>比赛总结</span><span style="color:var(--green)">已索引</span><button>•••</button></div><div class="row"><b>图论基础.pdf</b><span>课程资料</span><span style="color:var(--green)">已索引</span><button>•••</button></div><div class="row"><b>2025 ICPC 题解.zip</b><span>题解</span><span class="muted">处理中</span><button>•••</button></div></div></main></div>`}
    function problems(){return nav()+`<div class="shell"><main class="main"><div class="eyebrow">PROBLEM SET / 03</div><h1 style="font-size:38px;letter-spacing:-1px;margin:15px 0 8px">题库</h1><p class="sub">选择一道题，开始分析；也可以在聊天输入框中使用 @ 调用题目。</p><div class="table"><div class="row head"><span>题目</span><span>难度</span><span>标签</span><span>操作</span></div><div class="row"><b>最短路怎么优化？</b><span>中等</span><span>图论 · 最短路</span><button class="pill" onclick="location.href='?page=chat'">分析</button></div><div class="row"><b>区间修改与查询</b><span>中等</span><span>数据结构 · 线段树</span><button class="pill" onclick="location.href='?page=chat'">分析</button></div><div class="row"><b>背包问题进阶</b><span>困难</span><span>动态规划</span><button class="pill" onclick="location.href='?page=chat'">分析</button></div></div></main></div>`}
    function auth(){return nav()+`<main class="auth"><div class="auth-box"><div class="eyebrow">WELCOME TO CODEATLAS</div><h1>登录你的训练场</h1><div class="field"><label>邮箱</label><input placeholder="you@example.com"></div><div class="field"><label>密码</label><input type="password" placeholder="至少 8 位字符"></div><button class="pill fill">登录 →</button><div class="link">还没有账号？注册一个</div></div></main>`}
    let page=query.get('page')||'chat'; const loggedIn=localStorage.getItem('codeatlas-demo-login')==='yes'; document.body.className='variant-'+variant+' '+(page==='chat'?'chat-page ':'no-chat ')+(loggedIn?'signed-in':'signed-out'); document.getElementById('app').innerHTML=page==='chat'?nav()+chat():page==='library'?library():page==='problems'?problems():page==='auth'?auth():home();
    document.querySelector('.brand').innerHTML='<i></i>CodeAtlas';
    document.querySelectorAll('.brand').forEach(b=>b.innerHTML='<i></i>CodeAtlas');
    document.querySelectorAll('.nav button')[4]?.remove();
    document.querySelectorAll('.top-actions .pill').forEach((b,i)=>{if(i===0)b.onclick=()=>{localStorage.setItem('codeatlas-demo-login','yes');location.reload()}});
    document.querySelectorAll('.side-item').forEach(item=>{item.onclick=()=>{if(item.closest('.chat-side')||page==='home')location.href='?page=chat'}});
    document.querySelector('.split .stat')?.replaceChildren(document.createTextNode('3'),Object.assign(document.createElement('span'),{textContent:' 个会话',style:'font-size:14px;color:var(--muted)'})); document.querySelector('.split .panel .stat')?.nextElementSibling?.replaceChildren(document.createTextNode('今日已开启 3 个 AI 会话'));
    document.querySelectorAll('.nav button').forEach((b,i)=>{b.onclick=()=>{if(i===0)location.href='?page=home';else if(i===1)location.href='?page=chat';else if(i===2)location.href='?page=problems';else if(i===3)location.href='?page=library';else toast()}});
    const profile=document.querySelector('.profile'); if(profile){const wrap=profile.parentElement; wrap.className='profile-wrap'; profile.onclick=()=>wrap.classList.toggle('open'); const menu=document.createElement('div');menu.className='profile-menu';menu.innerHTML='<button onclick="location.href=\'?page=auth\'">退出登录</button>';wrap.appendChild(menu)}
    const modeButton=document.querySelector('.mode'); if(modeButton){const wrap=document.createElement('div');wrap.className='mode-picker';modeButton.parentNode.insertBefore(wrap,modeButton);wrap.appendChild(modeButton);const menu=document.createElement('div');menu.className='mode-menu';menu.innerHTML='<button onclick="setMode(this,\'普通模式\')">普通模式<small>通用问答，不做竞赛专项分析</small></button><button onclick="setMode(this,\'ACM 分析模式\')">ACM 分析模式<small>分析题目，不输出完整代码</small></button><button onclick="setMode(this,\'ACM 解题模式\')">ACM 解题模式<small>确认语言后生成竞赛代码</small></button>';wrap.appendChild(menu);modeButton.onclick=()=>wrap.classList.toggle('open')}
    const attach=document.querySelector('.composer-foot button'); if(attach){attach.className+=' attach';attach.innerHTML='+ 附件<input type="file" accept=".md,.pdf,.doc,.docx,.txt,.cpp,.java,.py">';attach.querySelector('input').onchange=e=>{if(e.target.files[0]){attach.firstChild.textContent='已选择：'+e.target.files[0].name;toast()}}}
    document.querySelector('.composer-foot button:nth-of-type(3)')?.remove();
    if(page==='library'){const main=document.querySelector('.main');const tools=document.createElement('div');tools.className='library-tools';tools.innerHTML='<input placeholder="搜索文档、笔记或代码"><select><option>全部分组</option><option>算法模板</option><option>个人笔记</option><option>题解</option><option>比赛总结</option><option>错题</option><option>课程资料</option></select><button class="pill fill" onclick="toast()">＋ 上传文档</button>';main.querySelector('.sub').after(tools)}
    document.addEventListener('click',e=>{if(!e.target.closest('.profile-wrap'))document.querySelector('.profile-wrap')?.classList.remove('open')});
    function setMode(button,label){const picker=button.closest('.mode-picker');picker.querySelector('.mode').textContent='⌘ '+label;picker.classList.remove('open');toast()}
    function toast(){const t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
    const switcher=document.createElement('div');switcher.className='switcher';switcher.innerHTML='<button id="prev">←</button><strong></strong><button id="next">→</button>';switcher.querySelector('strong').textContent=variants[variant];document.body.appendChild(switcher);
    function cycle(delta){const keys=Object.keys(variants),i=(keys.indexOf(variant)+delta+keys.length)%keys.length;location.search='?variant='+keys[i]}
    document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.onkeydown=e=>{if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))cycle(e.key==='ArrowRight'?1:-1)};
  </script>
</body>
</html>
